[package]
name = "xtask"
description = "Build, check and determinism orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sim-core.workspace = true
# The tile and geodesy vectors (ADR-51 GE9) and their seeded points.
geo = { workspace = true, features = ["testkit"] }
# The GeoPack format vectors (ADR-51 GP5).
geo-pack.workspace = true
# The snapshot vectors fly the core pack's aircraft.
content-bake = { path = "../../tools/content-bake" }
brotli = "9.0.0"
serde_json = "1.0.152"
sha2 = "0.11.0"
wasmparser = "0.261.0"
