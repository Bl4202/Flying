[package]
name = "content-bake"
description = "Validates authoring JSON and bakes it into a .cpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
content.workspace = true
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
# The gear lints and the Kestrel aero-table generator (content/core/aero/kestrel_gen.rs) use the
# deterministic maths (ADR-10), like everything else in the workspace.
simmath.workspace = true
