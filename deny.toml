[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# GDD 61.7: MIT / Apache-2.0 / BSD / ISC / MPL allow-list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Our own crates carry `LicenseRef-Proprietary` until OQ-04 is decided.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unpublished (publish = false), so they carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
