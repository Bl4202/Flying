[package]
name = "sim-wasm"
description = "Hand-written C ABI over sim-core for WebAssembly (GDD 61.4.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Not `workspace = true`: this is the one audited crate allowed to use unsafe (see UNSAFE.md).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"

[dependencies]
sim-core.workspace = true

[dev-dependencies]
# tests/flight_no_alloc.rs and tests/fcs_no_alloc.rs: the flight model's tick and the control
# system's step on their own, with the real Kestrel. They live here because only this crate may
# implement the counting allocator (unsafe).
content.workspace = true
content-bake = { path = "../../tools/content-bake" }
fcs.workspace = true
flight.workspace = true
simmath.workspace = true
