name: perf-nightly

# PS-0, the empty loop, for two minutes on a CI runner, kept as an artifact so a trend can be read
# off it. The runners are shared and have no GPU, so nothing here fails the build; the strict
# gates are checked on the reference machines (ADR-28).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Length of the measured window, in seconds
        default: '120'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: 'true'

jobs:
  ps0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          nightly: 'true'
          tools: binaryen
      - run: pnpm build
        env:
          GIT_SHA: ${{ github.sha }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: PS-0
        run: pnpm exec playwright test --project=perf -g "PS-0 produces"
        env:
          PERF_SECONDS: ${{ inputs.seconds || '120' }}
          PERF_REPORT_DIR: perf-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-ps0-${{ github.run_id }}
          path: |
            perf-reports
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 90
